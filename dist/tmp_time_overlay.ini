[overlay]
; Font height in pixels, from 10 to 72.
font_size=16
font_name=Segoe UI

; Distance from the bottom edge of the game client area.
bottom_margin=12

; RGB colors in RRGGBB format.
text_color=FFFFFF
shadow_color=000000

; 1 hides the clock while the game is not the foreground application.
hide_when_unfocused=1

; 1 adds "Current Time: " before the UTC timestamp.
show_prefix=1
